<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfer listings · Ballerz</title><link rel="stylesheet" href="/matchday.css"><link rel="stylesheet" href="/listings.css"></head>
<body><header class="mast"><div class="wrap mast-inner"><a class="brand" href="/">Ballerz<span>.</span></a><div class="mast-rule"></div><a href="/" class="desk-back">Match centre</a></div></header>
<main class="desk"><h1>Transfer listings</h1><p>Solana Devnet · Test BB</p>
<section aria-labelledby="player"><h2 id="player">Trial winger</h2><p id="market" aria-live="polite">Checking the current listing…</p><p id="reference"></p>
<button id="connect" type="button">Connect seller wallet</button><p id="account"></p></section>
<section id="editor" hidden><h2>Seller terms</h2><label for="price">Fixed price in test BB</label>
<input id="price" type="number" min="1" step="1" value="100000" required><div class="actions"><button id="review">Review listing</button><button id="cancel" hidden>Review cancellation</button></div></section>
<section id="approval" hidden><h2 id="review-title">Review listing</h2><dl id="terms"></dl><button id="sign">Approve in wallet</button></section>
<p id="message" role="status" aria-live="polite"></p><button id="refresh">Refresh listing</button></main>
<script src="/vendor/solana.js"></script><script type="module" src="/listings.js"></script></body></html>
